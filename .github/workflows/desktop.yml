name: Desktop

on:
  push:
    branches: [main]
    # A tag such as v0.2.0 makes a draft release. Paths do not filter a tag.
    tags: ["v*"]
    paths: ["desktop/**", ".nvmrc", ".github/workflows/desktop.yml"]
  # Every pull request, docs too: main requires this workflow's three checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

env:
  CARGO_TERM_COLOR: always
  # What Tauri needs to build on Linux. docs/desktop.md lists the same.
  LINUX_BUILD_DEPS: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev

jobs:
  check:
    name: Typecheck, test, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The Rust side embeds the page, so it is built first.
      - run: npm run build
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  licences:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # It reads the lockfile, so nothing needs installing.
      - run: npm run licences
      # Only cargo-deny and the registry: this job builds nothing of the app.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
        working-directory: desktop/src-tauri

  acceptance:
    name: Acceptance, gate, and double-click
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the build, the driver, a display, and what the tests drive it with
        run: >-
          sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
          webkit2gtk-driver xvfb xdotool poppler-utils dbus-daemon libglib2.0-bin
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cached, so after the first run this finds it installed and builds nothing.
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm ci
      - run: npx tauri build --debug --bundles deb
      - name: Install the package, as a reader would
        run: sudo dpkg -i src-tauri/target/debug/bundle/deb/*.deb
      # Each in a session bus of its own, as a desktop has, and not the runner's. The runner's
      # bus can start a desktop portal that never comes up without a display, and GTK waits
      # 30 s for it at every launch (docs/desktop.md).
      - name: Section 8, items 1, 2, 4, 5, and 6
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node test/acceptance.mjs src-tauri/target/debug/hshblk
      - name: Section 9, the click-target gate
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node test/gate/click-target.mjs src-tauri/target/debug/hshblk
      - name: Section 8, item 7, on Linux
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- test/double-click.sh

  webview2:
    # #270: what only WebView2 shows, which the Linux suite reads from the page's rules. The
    # app is driven over its DevTools port, and keys are posted to its window (test/keys.ps1).
    name: WebView2 on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, keyed on Cargo.lock, rustc, and the job. Only main saves.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - name: F5 and Ctrl+R, the right-click menu, print's header and footer, a contrast theme
        run: node test/webview2.mjs src-tauri/target/debug/hshblk.exe

  bundle:
    # A job its condition skips never expands its matrix, so the name holds no matrix value.
    # GitHub adds the values to each job that runs.
    name: Bundle
    # macOS minutes cost ten times Linux's on a private repository, so bundles wait for main.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - if: runner.os != 'macOS'
        run: npx tauri build
      # A release is signed and notarized when its secrets are set (docs/desktop.md, Releasing).
      # tauri build signs whenever a variable is set, even to nothing, so each one without a
      # value is unset, and none is kept for a build of main. Without a certificate the bundle
      # is signed ad hoc. The linker signs only the binary, which seals nothing else in the
      # bundle, so `codesign --verify` failed and Gatekeeper refused a downloaded copy.
      - name: Build the packages, signed for a release
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ "$GITHUB_REF" != refs/tags/v* || -z "${!name}" ]]; then unset "$name"; fi
          done
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then export APPLE_SIGNING_IDENTITY=-; fi
          npx tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-block-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, licences, acceptance, webview2, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag names the version the packages carry, so the three places it is written agree.
      - name: Check the tag against the version
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hash-block-*
          path: packages
      # A draft, so nothing is public until it is published by hand. A second run on the same
      # tag replaces the packages in the draft it made.
      - name: Make the draft release, or refresh its packages
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find packages -type f | sort)
          if (( ${#files[@]} == 0 )); then echo "No packages were built." >&2; exit 1; fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag \
              --title "Hash Block ${GITHUB_REF_NAME#v}" --generate-notes
          fi
