name: Desktop

on:
  push:
    branches: [main]
    # A tag such as v0.2.0 makes a draft release. Paths do not filter a tag.
    tags: ["v*"]
    paths: ["desktop/**", ".nvmrc", ".github/workflows/desktop.yml"]
  # Every pull request, docs too: main requires this workflow's four checks.
  pull_request:
  # By hand: every job runs, and from a branch the release job is a dry run (#372).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

env:
  CARGO_TERM_COLOR: always
  # What Tauri needs to build on Linux. docs/desktop.md lists the same.
  LINUX_BUILD_DEPS: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev

jobs:
  check:
    name: Typecheck, test, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The Rust side embeds the page, so it is built first.
      - run: npm run build
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  licences:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # It reads the lockfile, so nothing needs installing.
      - run: npm run licences
      # Only cargo-deny and the registry: this job builds nothing of the app.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
        working-directory: desktop/src-tauri

  acceptance:
    name: Acceptance, gate, and double-click
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the build, the driver, a display, and what the tests drive it with
        run: >-
          sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
          webkit2gtk-driver xvfb xdotool poppler-utils dbus-daemon libglib2.0-bin
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cached, so after the first run this finds it installed and builds nothing.
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm ci
      - run: npx tauri build --debug --bundles deb
      - name: Install the package, as a reader would
        run: sudo dpkg -i src-tauri/target/debug/bundle/deb/*.deb
      # Each in a session bus of its own, as a desktop has, and not the runner's. The runner's
      # bus can start a desktop portal that never comes up without a display, and GTK waits
      # 30 s for it at every launch (docs/desktop.md).
      - name: Section 8, items 1, 2, 4, 5, and 6
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node test/acceptance.mjs src-tauri/target/debug/hshblk
      - name: Section 9, the click-target gate
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node test/gate/click-target.mjs src-tauri/target/debug/hshblk
      - name: Section 8, item 7, on Linux
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- test/double-click.sh

  webview2:
    # #270: what only WebView2 shows, which the Linux suite reads from the page's rules. The
    # app is driven over its DevTools port, and keys are posted to its window (test/keys.ps1).
    name: WebView2 on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, keyed on Cargo.lock, rustc, and the job. Only main saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      # The runner runs the app elevated, and since Runtime 150 WebView2 then drops the browser
      # arguments the environment gives it. It takes them from machine policy alone.
      - name: Let WebView2 open a DevTools port for hshblk.exe
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name hshblk.exe -Value "--remote-debugging-port=0" -PropertyType String -Force | Out-Null
      - name: F5 and Ctrl+R, the right-click menu, print's header and footer, a contrast theme
        run: node test/webview2.mjs src-tauri/target/debug/hshblk.exe
      # A launch the test gives up on leaves a picture of the screen (test/webview2-state.ps1).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webview2-screen
          path: ${{ runner.temp }}/webview2.png
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    # A job its condition skips never expands its matrix, so the name holds no matrix value.
    # GitHub adds the values to each job that runs.
    name: Bundle
    # macOS minutes cost ten times Linux's on a private repository, so bundles wait for main.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - if: runner.os != 'macOS'
        run: npx tauri build
      # A release is signed and notarized when its secrets are set (docs/desktop.md, Releasing).
      # tauri build signs whenever a variable is set, even to nothing, so each one without a
      # value is unset, and none is kept for a build of main. Without a certificate the bundle
      # is signed ad hoc. The linker signs only the binary, which seals nothing else in the
      # bundle, so `codesign --verify` failed and Gatekeeper refused a downloaded copy.
      - name: Build the packages, signed for a release
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ "$GITHUB_REF" != refs/tags/v* || -z "${!name}" ]]; then unset "$name"; fi
          done
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then export APPLE_SIGNING_IDENTITY=-; fi
          npx tauri build
      # One zip a system, named for it, such as hash-block-0.1.0-windows-x64.zip: the app, and a
      # README from packaging/ that says how to install it. It is what a release offers. ditto
      # copies and zips the macOS app with its signature whole, as Apple's notarization docs do.
      - name: Zip the app with its README
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          os=$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_OS")
          arch=$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_ARCH")
          name="hash-block-$version-$os-$arch"
          bundle=src-tauri/target/release/bundle
          out=src-tauri/target/release/zip
          rm -rf "$out" && mkdir -p "$out/$name"
          sed "s/@VERSION@/$version/" "packaging/README-$RUNNER_OS.txt" > "$out/$name/README.txt"
          case "$RUNNER_OS" in
            Linux)
              cp "$bundle"/deb/*.deb "$out/$name/hash-block.deb"
              cp "$bundle"/rpm/*.rpm "$out/$name/hash-block.rpm"
              cp src-tauri/target/release/hshblk "$out/$name/hshblk"
              (cd "$out" && zip -qr "$name.zip" "$name")
              ;;
            macOS)
              ditto "$bundle/macos/Hash Block.app" "$out/$name/Hash Block.app"
              codesign --verify --deep --strict "$out/$name/Hash Block.app"
              (cd "$out" && ditto -c -k --keepParent "$name" "$name.zip")
              ;;
            Windows)
              cp "$bundle"/nsis/*.exe "$out/$name/Hash Block setup.exe"
              cp src-tauri/target/release/hshblk.exe "$out/$name/Hash Block.exe"
              (cd "$out" && 7z a -tzip -bso0 "$name.zip" "$name")
              ;;
          esac
          echo "ZIP=desktop/$out/$name.zip" >> "$GITHUB_ENV"
      # The zip goes up as it is, so the artifact is the zip itself, not a zip around it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZIP }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    # On a tag such as v0.2.0, the job makes the draft release. Run by hand from a branch, it is a
    # dry run for the tag the version in package.json would take: it writes nothing, and its
    # summary says what a run on that tag would do (#372).
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check, licences, acceptance, webview2, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # A dry run needs it too: GitHub lists drafts only to a token that can write.
      contents: write
    env:
      DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the tag
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            echo "TAG=v$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      # The tag names the version the packages carry, so the three places it is written agree.
      - name: Check the tag against the version
        run: node scripts/release-version.mjs "$TAG"
      # Each artifact is a system's zip, which goes in the release as it is. Without
      # skip-decompress the action would unzip it, since it is a zip.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hash-block-*
          path: packages
          merge-multiple: true
          skip-decompress: true
      # The notes start with which zip is for which system, above the merged pull requests GitHub
      # lists. A zip that names no system or another version, or a system with no zip, stops the
      # job here, before any draft is touched.
      - name: Write the notes
        working-directory: .
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find packages -type f -name '*.zip' | sort)
          node desktop/scripts/release-notes.mjs "$TAG" "${files[@]}" > notes.md
      # A second run on the tag makes the draft again, so it holds only that run's zips and notes:
      # the drafts an earlier run made are deleted first. A published release stops the run, and
      # nothing is changed (#367).
      - name: Delete the tag's drafts, or stop if it is published
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-drafts.mjs "$TAG"
      # A draft, so nothing is public until it is published by hand.
      - name: Make the draft release
        if: env.DRY_RUN == 'false'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find packages -type f -name '*.zip' | sort)
          gh release create "$TAG" "${files[@]}" --draft --verify-tag \
            --title "Hash Block ${TAG#v}" --notes "$(cat notes.md)" --generate-notes
      # What the two steps above would do, in the run's summary. GitHub's list comes from the
      # endpoint gh release create calls, which makes nothing. For a tag that exists already, it
      # would list that release's pull requests, not the next one's, so it is left out.
      - name: Say what a run on the tag would do
        if: env.DRY_RUN == 'true'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "## A dry run for $TAG"
            echo
            node desktop/scripts/release-drafts.mjs "$TAG" --dry-run
            echo
            echo "## The draft's notes"
            echo
            cat notes.md
            echo
            if gh api "repos/{owner}/{repo}/git/ref/tags/$TAG" --silent 2> /dev/null; then
              echo "_$TAG is tagged already, so GitHub's list of merged pull requests is left out._"
            else
              gh api --method POST "repos/{owner}/{repo}/releases/generate-notes" \
                -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
