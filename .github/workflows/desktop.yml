name: Desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".nvmrc", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".nvmrc", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

env:
  CARGO_TERM_COLOR: always
  # What Tauri needs to build on Linux. docs/desktop.md lists the same.
  LINUX_BUILD_DEPS: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev

jobs:
  check:
    name: Typecheck, test, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - run: rustup update stable --no-self-update && rustup default stable
      - run: rustup component add rustfmt clippy
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Rust side embeds the page, so it is built first.
      - run: npm run build
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri

  licences:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # It reads the lockfile, so nothing needs installing.
      - run: npm run licences
      # Only cargo-deny and the registry: this job builds nothing of the app.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
        working-directory: desktop/src-tauri

  acceptance:
    name: Acceptance, gate, and double-click
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the build, the driver, a display, and what the tests drive it with
        run: >-
          sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
          webkit2gtk-driver xvfb xdotool poppler-utils dbus-daemon libglib2.0-bin
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cached, so after the first run this finds it installed and builds nothing.
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm ci
      - run: npx tauri build --debug --bundles deb
      - name: Install the package, as a reader would
        run: sudo dpkg -i src-tauri/target/debug/bundle/deb/*.deb
      # Each in a session bus of its own, as a desktop has, and not the runner's. The runner's
      # bus can start a desktop portal that never comes up without a display, and GTK waits
      # 30 s for it at every launch (docs/desktop.md).
      - name: Section 8, items 1, 2, 4, 5, and 6
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node test/acceptance.mjs src-tauri/target/debug/hshblk
      - name: Section 9, the click-target gate
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- node test/gate/click-target.mjs src-tauri/target/debug/hshblk
      - name: Section 8, item 7, on Linux
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- test/double-click.sh

  bundle:
    # A job its condition skips never expands its matrix, so the name holds no matrix value.
    # GitHub adds the values to each job that runs.
    name: Bundle
    # macOS minutes cost ten times Linux's on a private repository, so bundles wait for main.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - run: rustup update stable --no-self-update && rustup default stable
      # Dependencies, and what cargo install built, keyed on Cargo.lock, rustc, and the job.
      # Only main saves, so pull requests read its cache and do not crowd it out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-block-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
