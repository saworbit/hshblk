name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write the app env the platform would
        # The platform writes this file and it is not committed. The reader has no sign-in.
        run: mkdir -p .grok && echo '{"VITE_AUTH_ENABLED":"false"}' > .grok/app-env.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write the app env the platform would
        run: mkdir -p .grok && echo '{"VITE_AUTH_ENABLED":"false"}' > .grok/app-env.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots
          path: test-results/
          retention-days: 7
