name: Bug
description: A file that reads wrong, or a page that misbehaves
labels: [bug]
body:
  - type: textarea
    id: markdown
    attributes:
      label: The markdown
      description: The smallest piece of the file that shows the problem.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: wrong
    attributes:
      label: What's wrong?
      description: What the page shows, and what it should show instead.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: The desktop app's version and the operating system. On Linux, the WebKitGTK version too.
      placeholder: e.g. the desktop app 0.1.0 on Ubuntu 24.04, WebKitGTK 2.52.6
    validations:
      required: true
